# Configuration for Repo Lockdown - https://github.com/dessant/repo-lockdown

name: 'Repo Lockdown'

on:
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/repo-lockdown@v2
        with:
          pr-comment: |
            Thank you for your interest in AndromedaCore.

            Please include a clear description of the change, steps to reproduce (for bugs),
            and build/test information where applicable.
          lock-pr: false
          close-pr: false
