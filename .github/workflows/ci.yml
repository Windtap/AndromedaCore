name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            libglib2.0-dev \
            libpixman-1-dev

      - name: Configure
        run: |
          mkdir -p build
          cd build
          ../configure --disable-docs --disable-tools --disable-werror --target-list=x86_64-softmmu

      - name: Build
        run: |
          make -C build -j2
